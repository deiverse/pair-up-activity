<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service - Dulce Bakes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8e1db;
            color: #4B4B4B;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: #7a4e39;
        }
        .navbar-brand, .nav-link {
            color: #fceade !important;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .navbar-nav .nav-item:hover::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 100%;
            height: 2px;
            background-color: #fceade;
            transition: width 0.3s ease-in-out;
        }

        .nav-link:hover {
            background-color: rgba(252, 234, 222, 0.2);
            box-shadow: 0px 2px 10px rgba(252, 234, 222, 0.5);
            text-decoration: underline;
        }

        header {
            background-color: #7a4e39;
            color: #fceade;
            padding: 80px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-grow: 1;
        }

        .content {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .footer {
            background-color: #7a4e39;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }

        .footer a {
            color: #fceade;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .contact-form {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            text-align: left;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .contact-form button {
            background-color: #7a4e39;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .contact-form button:hover {
            background-color: #5c3b2a;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><em>Dulce Bakes ｡𖦹°‧</em></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html">Orders & Shipping</a></li>
                    <li class="nav-item"><a class="nav-link" href="collections.html">Pastry Collections</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Customer Service</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header>
        <h1>📞 Customer Service 📩</h1>
    </header>

    <div class="container">
        <section class="content">
            <h2>Contact Us</h2>
            <p>If you have any questions or concerns, feel free to reach out to us!</p>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="4" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </div>

    <footer class="footer">
        <p><a href="https://www.facebook.com/majaaaaaaaadeahhhhhhh">Facebook</a> | <a href="https://github.com/deiverse">GitHub</a></p>
        <p>Call us at: 0935 984 7855 | Email: dulcebakes@gmail.com</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
